        about:
            title_prefix: Über
            history:
                title: Die Geschichte
                p1:
                    "Max entdeckte Boolder bei Kletterausflügen nach Fontainebleau.
                    Es war die erste Outdoor-Kletter-App, die gut funktionierte -
                    gute Datenqualität und Open Source (das heißt, der Code ist
                    frei verfügbar für jeden zur Nutzung und Änderung)."
                p2:
                    "Die Idee, sie zu forken (eine modifizierte Version zu erstellen)
                    für andere Gebiete kam auf, wurde dann aber zwei Jahre lang
                    verschoben."
                p3:
                    "Sie kam während einer Reise nach Maltatal, Österreich, zurück.
                    Zwölf Leute, ein Kletterführer (Max hatte seinen zu Hause
                    vergessen). Ein einzelnes Buch zwischen so vielen Kletterern
                    zu teilen funktioniert nicht. Die existierenden Apps waren nicht
                    gut genug, dass jemand sie nutzen wollte."
                p4:
                    "Also forkte Max Boolder, passte es für Österreich an und begann,
                    Bouldergebiete zu kartieren. Das ist %{brand_name}. Eine
                    modifizierte Version von Boolders Open-Source-Projekt für
                    österreichisches Bouldern."
            project:
                title: Das Projekt
                contact: kontaktieren
                p1:
                    "%{brand_name} ist ein gemeinnütziges Projekt, das von
                    Freiwilligen verwaltet wird."
                p2_html:
                    Unser Ziel ist es, das Entdecken des Boulderns in Österreich
                    auf <strong>spielerische</strong> Weise und mit
                    <strong>Respekt für die Natur</strong> zu erleichtern.
                p3_html:
                    Da das Projekt noch sehr jung ist, sind wir offen für
                    Vorschläge und Ideen, um die gegenseitige Hilfe mit der
                    Community zu fördern. Zögere nicht, uns zu %{link}!
            team:
                title: Das Team
                max_desc: Kartierung, Entwicklung, Datensammlung
            original_team:
                title: Ursprüngliches Boolder-Team
                subtitle_html:
                    "%{brand_name} ist ein Fork von <a href='https://www.boolder.com' target='_blank' class='underline'>Boolder</a>, der ausgezeichneten Boulder-App für Fontainebleau, erstellt von Nicolas, Romain, Cyril und Emile. Wir sind dankbar für ihre Arbeit, eine Open-Source-Plattform zu schaffen, die das Bouldern zugänglicher macht."
                nico_desc: Entwicklung, Kartierung
                romain_desc: Klettern
                cyril_desc: Klettern
                emile_desc: Kartierung
            contact:
                title: Kontakt
                p1: Bei Fragen kannst du uns kontaktieren unter
            support:
                title: Danksagungen
                p1:
                    "Wir danken allen, die zur Klettergemeinschaft in Österreich
                    beigetragen haben: den Erstbegehern, allen, die zur Wartung
                    und Reinigung von Bouldern beigetragen haben, und den
                    Naturschutzbemühungen."
                app: App
            open:
                title: Eine kollaborative Plattform
                p1_html:
                    Der Code der Apps sowie die Daten sind als Open Source auf
                    %{link} verfügbar.
                p2_html:
                    Du kannst auch %{link}, indem du fehlende Routen kartierst
                    oder Fehler meldest.
                contribute_link: beitragen
            web_dev:
                title: Du kannst programmieren?
                p1_html:
                    Wir suchen aktiv einen %{link_web} und %{link_ios}
                    Entwickler. Trag bei!
            faq:
                title: Häufig gestellte Fragen
                data:
                    question: Woher stammen die Daten?
                    p1:
                        Die Fotos und geografischen Daten (GPS) wurden vom
                        %{brand_name}-Team gesammelt.
                    p3:
                        Einige Boulder-Zeichnungen (in Draufsicht) sind von
                        bestehenden Topo-Guides inspiriert. Wir arbeiten daran,
                        sie durch Originalzeichnungen zu ersetzen.
                why_free:
                    question: Warum ist die App kostenlos?
                    p1:
                        Weil wir möchten, dass so viele Menschen wie möglich
                        davon profitieren können!
                    p2:
                        Durch die Nutzung der Open-Source-Codebasis von Boolder
                        sind die Kosten für die Anpassung und Wartung von
                        %{brand_name} für Österreich sehr gering geblieben. Wir
                        planen, diese Dynamik in Zukunft durch ein freiwilliges
                        Open-Source-Modell fortzusetzen.
                privacy:
                    question: Welche persönlichen Daten sammelt ihr?
                    p1_html: Du kannst unsere %{link} einsehen.
                    policy: Datenschutzrichtlinie
