services:
    db:
        image: postgis/postgis:16-3.5
        platform: linux/amd64
        container_name: austrian-rocks-db
        environment:
            POSTGRES_USER: austrian-rocks
            POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}
            POSTGRES_DB: dump-prod
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U austrian-rocks -d dump-prod"]
            interval: 10s
            timeout: 5s
            retries: 5

    web:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: austrian-rocks-web
        command: bash -lc "bin/docker-dev-web"
        volumes:
            - .:/rails
        ports:
            - "3000:3000"
        environment:
            RAILS_ENV: ${RAILS_ENV:-development}
            DATABASE_URL: postgis://austrian-rocks:${DEV_POSTGRES_PASSWORD:-password}@db:5432/dump-prod
            DB_HOST: db
            POSTGRES_USER: austrian-rocks
            POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}
            POSTGRES_DB: dump-prod
            DEV_DB_DUMP_PATH: ${DEV_DB_DUMP_PATH:-tmp/db/production.dump}
            DEV_DB_RESTORE: ${DEV_DB_RESTORE:-if-empty}
            RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
            BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-}
            BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
            BUNNY_STORAGE_BUCKET: ${BUNNY_STORAGE_BUCKET:-}
            BUNNY_STORAGE_ACCESS_KEY_ID: ${BUNNY_STORAGE_ACCESS_KEY_ID:-}
            BUNNY_STORAGE_SECRET_ACCESS_KEY: ${BUNNY_STORAGE_SECRET_ACCESS_KEY:-}
            S3_ENDPOINT: ${S3_ENDPOINT:-}
            S3_REGION: ${S3_REGION:-}
            S3_BUCKET: ${S3_BUCKET:-}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
        depends_on:
            db:
                condition: service_healthy
        stdin_open: true
        tty: true

volumes:
    postgres_data:
