---
de:
  activerecord:
    errors:
      messages:
        record_invalid: 'Validierung fehlgeschlagen: %{errors}'
        restrict_dependent_destroy:
          has_one: Der Eintrag kann nicht gelöscht werden, da ein abhängiger %{record}
            Eintrag existiert
          has_many: Der Eintrag kann nicht gelöscht werden, da abhängige %{record}
            Einträge existieren
  date:
    abbr_day_names:
    - So
    - Mo
    - Di
    - Mi
    - Do
    - Fr
    - Sa
    abbr_month_names:
    -
    - Jan.
    - Feb.
    - März
    - Apr.
    - Mai
    - Juni
    - Juli
    - Aug.
    - Sept.
    - Okt.
    - Nov.
    - Dez.
    day_names:
    - Sonntag
    - Montag
    - Dienstag
    - Mittwoch
    - Donnerstag
    - Freitag
    - Samstag
    formats:
      default: "%d.%m.%Y"
      long: "%-d. %B %Y"
      short: "%-d. %b"
    month_names:
    -
    - Januar
    - Februar
    - März
    - April
    - Mai
    - Juni
    - Juli
    - August
    - September
    - Oktober
    - November
    - Dezember
    order:
    - :day
    - :month
    - :year
  datetime:
    distance_in_words:
      about_x_hours:
        one: etwa eine Stunde
        other: etwa %{count} Stunden
      about_x_months:
        one: etwa ein Monat
        other: etwa %{count} Monate
      about_x_years:
        one: etwa ein Jahr
        other: etwa %{count} Jahre
      almost_x_years:
        one: fast ein Jahr
        other: fast %{count} Jahre
      half_a_minute: eine halbe Minute
      less_than_x_seconds:
        zero: weniger als eine Sekunde
        one: weniger als eine Sekunde
        other: weniger als %{count} Sekunden
      less_than_x_minutes:
        zero: weniger als eine Minute
        one: weniger als eine Minute
        other: weniger als %{count} Minuten
      over_x_years:
        one: mehr als ein Jahr
        other: mehr als %{count} Jahre
      x_seconds:
        one: "%{count} Sekunde"
        other: "%{count} Sekunden"
      x_minutes:
        one: "%{count} Minute"
        other: "%{count} Minuten"
      x_days:
        one: "%{count} Tag"
        other: "%{count} Tage"
      x_months:
        one: "%{count} Monat"
        other: "%{count} Monate"
      x_years:
        one: "%{count} Jahr"
        other: "%{count} Jahre"
    prompts:
      second: Sekunde
      minute: Minute
      hour: Stunde
      day: Tag
      month: Monat
      year: Jahr
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: muss akzeptiert werden
      blank: muss ausgefüllt werden
      confirmation: stimmt nicht mit %{attribute} überein
      empty: muss ausgefüllt werden
      equal_to: muss gleich %{count} sein
      even: muss gerade sein
      exclusion: ist nicht verfügbar
      greater_than: muss größer als %{count} sein
      greater_than_or_equal_to: muss größer oder gleich %{count} sein
      in: muss im Bereich %{count} liegen
      inclusion: ist nicht in der Liste enthalten
      invalid: ist ungültig
      less_than: muss kleiner als %{count} sein
      less_than_or_equal_to: muss kleiner oder gleich %{count} sein
      model_invalid: 'Validierung fehlgeschlagen: %{errors}'
      not_a_number: ist keine Zahl
      not_an_integer: muss eine ganze Zahl sein
      odd: muss ungerade sein
      other_than: muss anders als %{count} sein
      present: muss leer sein
      required: muss vorhanden sein
      taken: ist bereits vergeben
      too_long:
        one: ist zu lang (maximal ein Zeichen)
        other: ist zu lang (maximal %{count} Zeichen)
      too_short:
        one: ist zu kurz (mindestens ein Zeichen)
        other: ist zu kurz (mindestens %{count} Zeichen)
      wrong_length:
        one: hat die falsche Länge (muss genau ein Zeichen haben)
        other: hat die falsche Länge (muss genau %{count} Zeichen haben)
    template:
      body: 'Bitte überprüfe die folgenden Felder: '
      header:
        one: 'Konnte dieses %{model} nicht speichern: %{count} Fehler'
        other: 'Konnte dieses %{model} nicht speichern: %{count} Fehler'
  helpers:
    select:
      prompt: Bitte auswählen
    submit:
      create: "%{model} erstellen"
      submit: "%{model} speichern"
      update: "%{model} aktualisieren"
  number:
    currency:
      format:
        delimiter: "."
        format: "%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: "€"
    format:
      delimiter: "."
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: Milliarde
          million: Million
          quadrillion: Billiarde
          thousand: Tausend
          trillion: Billion
          unit: ''
      format:
        delimiter: ''
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Bytes
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
    percentage:
      format:
        delimiter: ''
        format: "%n%"
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: " und "
      two_words_connector: " und "
      words_connector: ", "
  time:
    am: vormittags
    formats:
      default: "%d. %B %Y %H:%M Uhr"
      long: "%A, %d. %B %Y %H:%M Uhr"
      short: "%d. %b %H:%M"
    pm: nachmittags
