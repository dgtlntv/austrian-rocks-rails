        about:
            title_prefix: About
            history:
                title: The story
                p1:
                    "Max discovered Boolder on climbing trips to Fontainebleau.
                    It was the first outdoor climbing app that worked well -
                    good data quality and open source (meaning the code is
                    freely available for anyone to use and modify)."
                p2:
                    "The idea to fork it (create a modified version) for other
                    areas came up, then got shelved for two years."
                p3:
                    "It came back during a trip to Maltatal, Austria. Twelve
                    people, one guidebook (Max had forgotten his at home).
                    Trying to share a single book between that many climbers
                    doesn't work. The existing apps weren't good enough for
                    anyone to want to use them."
                p4:
                    "So Max forked Boolder, adapted it for Austria, and started
                    mapping bouldering areas. That's %{brand_name}. A modified
                    version of Boolder's open source project for Austrian
                    bouldering."
            project:
                title: The Project
                contact: contact
                p1:
                    "%{brand_name} is a non-profit project, managed by
                    volunteers."
                p2_html:
                    Our goal is to make discovering bouldering in Austria
                    <strong>fun</strong> and <strong>respectful of
                    nature</strong>.
                p3_html:
                    The project is still very young, we welcome suggestions and
                    ideas to foster help within the climbing community. Feel
                    free to %{link} us!
            team:
                title: The team
                max_desc: Mapping, development, data collection
            original_team:
                title: Original Boolder team
                subtitle_html:
                    "%{brand_name} is a fork of <a href='https://www.boolder.com' target='_blank' class='underline'>Boolder</a>, the excellent bouldering app for Fontainebleau created by Nicolas, Romain, Cyril, and Emile. We're grateful for their work in creating an open source platform that makes bouldering more accessible."
                nico_desc: Dev, mapping
                romain_desc: Climbing lover
                cyril_desc: Climbing lover
                emile_desc: Mapping
            contact:
                title: Contact
                p1: For any questions, you can contact us at
            support:
                title: Thanks
                p1:
                    'We extend our thanks to everyone who has contributed to the
                    Austrian bouldering community: the route setters and all those who have contributed to the
                    maintenance and cleaning of boulders, and preservation efforts.'
                app: app
            open:
                title: A collaborative platform
                p1_html:
                    The code and data of the apps are available in open source
                    on %{link}.
                p2_html:
                    You can also %{link} by mapping missing problems or by
                    reporting mistakes.
                contribute_link: contribute
            web_dev:
                title: Know how to code?
                p1_html:
                    We are actively looking for a %{link_web} and an %{link_ios}
                    dev. Come and join us!
            faq:
                title: Frequently asked questions
                data:
                    question: Where does the data come from?
                    p1:
                        Photos and geographical data (GPS) were collected by the
                        %{brand_name} team.
                    p3:
                        Some of the boulder drawings (in top view) are inspired
                        by existing guidebooks. We are working to replace them
                        with original drawings.
                why_free:
                    question: Why is the app free?
                    p1: Because we want as many people as possible to enjoy it!
                    p2:
                        By building on the open source Boolder codebase, the cost
                        to adapt and maintain %{brand_name} for Austria has remained
                        very low. We plan to keep this momentum going in the future
                        thanks to volunteering and open source.
                privacy:
                    question: Do you collect personal data?
                    p1_html: You can consult our %{link}.
                    policy: Privacy policy
            metas:
                title: About %{brand_name}
