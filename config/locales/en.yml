                        title: "How to take the photo:"
                        instruction_1: Use your phone's "Camera" app
                        instruction_2_html: Take a <span class="underline">horizontal</span> photo. <span class="font-bold">Warning vertical photos are not accepted</span>
                        instruction_3: Frame the entire face of the boulder if possible
                        instruction_4: Keep a bit of margin at the top, bottom, left, and right of the boulder
                        instruction_5: Use the wide-angle mode (zoom x0.5) if available
                        instruction_6: Save the photo with the highest possible quality and size
                        example: "Example:"
                        details_title: "Additional details:"
                        detail_1: "If the route extends over several faces (example: a traverse), then take a photo of each face"
                        detail_2: Avoid objects in the photo (crash pads, bags) or people
                        detail_3: Avoid rainy days, as moisture makes the boulder hard to recognize
                        detail_4: Avoid shadows from tree branches and leaves
                    how_to_line:
                        instruction_1: Re-use the photo from the previous step
                        instruction_2: Use an app to draw the route line directly on the photo (for example with the Photos app)
                        instruction_3: Save the result in a separate image
                        example: "Example:"
                    how_to_location:
                        instruction_1: Take a screenshot of the map
                        instruction_2: Edit the image in drawing mode, as for the previous step
                        instruction_3: Draw a line to mark the exact starting position on an existing boulder
                        example: "Example:"
                        details_title: "Additional details:"
                        detail_1: If the boulder does not already exist on the map, draw it and indicate its precise GPS position in the dedicated field
